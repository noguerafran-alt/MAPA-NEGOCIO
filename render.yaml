services:
  - type: web
    name: rutas-aereas-argentina
    runtime: python
    plan: starter
    disk:
      name: mapa-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Dejá DATABASE_URL con la URL de Neon SOLO durante el primer deploy:
      # la app copia Neon → /var/data/mapa.db y después usa el disco.
      # Después de verificar que /admin y el mapa andan, podés borrar Neon.
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER_DISK_PATH
        value: /var/data
