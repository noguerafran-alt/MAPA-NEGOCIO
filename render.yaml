services:
  - type: web
    # El servicio real se llama MAPA-NEGOCIO (srv-d9qehnfqj5pc7389nq2g). Estaba escrito
    # "rutas-aereas-argentina", que es el nombre de OTRO servicio del workspace: aplicar
    # este blueprint asi habria creado un servicio NUEVO en vez de tomar el que corre, y
    # el que corre tiene el disco con el acumulado del poller.
    name: MAPA-NEGOCIO
    runtime: python
    plan: starter
    disk:
      name: mapa-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Dejá DATABASE_URL con la URL de Neon SOLO durante el primer deploy:
      # la app copia Neon → /var/data/mapa.db y después usa el disco.
      # Después de verificar que /admin y el mapa andan, podés borrar Neon.
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Token para bajar /api/msrtic/export.xlsx SIN sesion, que es lo que necesita
      # bajar_ms.py: un script no puede hacer el OAuth de Google. Va generado por Render
      # y no escrito aca -- un secreto en el repo es un secreto publicado.
      #
      # OJO: hoy este servicio NO se administra con este blueprint (se creo a mano, de
      # ahi que el nombre no coincidiera), asi que esta linea no lo configura sola. Hay
      # que ponerla en Environment del servicio. Queda declarada para que un servicio
      # creado desde el blueprint la tenga desde el arranque.
      #
      # Si falta o tiene menos de 20 caracteres, el endpoint solo acepta sesion de
      # nivel 1: el bypass esta apagado por defecto a proposito.
      - key: MS_EXPORT_TOKEN
        generateValue: true
      - key: RENDER_DISK_PATH
        value: /var/data
